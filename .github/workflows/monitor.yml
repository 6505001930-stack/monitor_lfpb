name: LFPB weather monitor

on:
  schedule:
    # Meteo-France's infrahoraire-6m station observation refreshes every
    # ~6-7 minutes; poll at that cadence. Open-Meteo/TAF/METAR are fetched
    # on the same schedule even though they update less often.
    - cron: "*/7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lfpb-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          METEOFRANCE_API_TOKEN: ${{ secrets.METEOFRANCE_API_TOKEN }}
        run: python monitor_lfpb.py

      - name: Commit updated data
        run: |
          git config user.name "lfpb-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update LFPB weather data [skip ci]"
            git push
          fi
